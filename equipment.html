<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment List</title>
</head>
<body>
    <h1>Equipment List</h1>
    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Code</th>
            <th>Price</th>
            <th>Description</th>
            <th>Image</th>
        </tr>
        {% for row in equipment_data %}
        <tr>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td><img src="{{ url_for('static', filename='uploads/' + row[5]) }}" height="100" width="100"></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
