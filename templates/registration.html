    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
            padding: 0;
            background-color: #f0f8ea; /* light green background color */
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 4%;
            border-radius: 8px;
            width: 45%;
                }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="navbar-brand" href="{{url_for('index')}}">
        <img src="{{ url_for('static', filename='logo/kisanmitra.png') }}" alt="Logo" style="display: block; margin: 0 auto; max-width: 200px;">
        </a>
        <h1 class="text-center mb-4">Registration Form</h1>
        {% if errors %}
        <div class="alert alert-danger">
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        <!-- Display success message if registration is successful -->
        {% if success_msg %}
        <div class="alert alert-success">
            {{ success_msg }}
        </div>
        {% endif %}
        <!-- Registration Form -->
        <form method="post">
            <div class="mb-3">
                <label for="fname" class="form-label">First Name:</label>
                <input type="text" class="form-control" id="fname" name="fname" placeholder="Enter First Name">
            </div>
            <div class="mb-3">
                <label for="lname" class="form-label">Last Name:</label>
                <input type="text" class="form-control" id="lname" name="lname" placeholder="Enter Last Name">
            </div>
            <div class="mb-3">
                <label for="phonenum" class="form-label">Phone Number:</label>
                <input type="text" class="form-control" id="phonenum" name="phonenum" placeholder="Enter Phone Number">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Id:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter Email Id">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address:</label>
                <input type="address" class="form-control" id="address" name="address" placeholder="Enter Address">
            </div>
            <!-- <div class="mb-3">
                <label for="state" class="form-label">State:</label>
                <select class="form-select" id="state" name="state" disabled>
                    <option value="" selected disabled>Select State</option>
                </select>
            </div> -->
            <div class="mb-3">
                <label for="city" class="form-label">City:</label>
                <select class="form-select" id="city" name="city" >
                    <option value="" selected>Select City</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label for="cpassword" class="form-label">Confirm Password:</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="cpassword" name="cpassword" placeholder="Confirm Password">
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                        <i class="bi bi-eye-fill" id="eyeIconConfirm"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <button type="reset" class="btn btn-primary">Reset</button>
            <div>
                <p class="bottom">
                <h5>Already Registerd ? <a class="bottom" href="{{url_for('login')}}">Login here</a></h5>
                </p>
            <div>
        </form>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Toggle eye icon class
            this.querySelector('i').classList.toggle('bi-eye-fill');
            this.querySelector('i').classList.toggle('bi-eye-slash-fill');
        });

        // Toggle confirm password visibility
