<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Image Gallery</title>
<style>
  .image-gallery {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
    overflow: hidden;
  }

  .images {
    display: flex;
    transition: transform 0.5s ease;
  }

  .image {
    width: 100%;
    flex: 0 0 auto;
  }

  .dots {
    text-align: center;
    margin-top: 10px;
  }

  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #bbb;
    margin: 0 5px;
    cursor: pointer;
  }

  .dot.active {
    background-color: #555;
  }
</style>
</head>
<body>

<div class="image-gallery">
  <div class="images">
    <div class="image">
      <img src="https://via.placeholder.com/600x400?text=Image+1" alt="Image 1">
    </div>
    <div class="image">
      <img src="https://via.placeholder.com/600x400?text=Image+2" alt="Image 2">
    </div>
    <div class="image">
      <img src="https://via.placeholder.com/600x400?text=Image+3" alt="Image 3">
    </div>
  </div>
  <div class="dots"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const images = document.querySelector('.images');
    const dotsContainer = document.querySelector('.dots');
    const dots = [];

    // Create dots
    for (let i = 0; i < images.children.length; i++) {
      const dot = document.createElement('span');
      dot.classList.add('dot');
      if (i === 0) {
        dot.classList.add('active');
      }
      dot.addEventListener('click', function() {
        setCurrentImage(i);
      });
      dots.push(dot);
      dotsContainer.appendChild(dot);
    }

    let currentImageIndex = 0;
    let interval;

    function setCurrentImage(index) {
      if (index < 0 || index >= images.children.length) return;
      currentImageIndex = index;
      updateGallery();
    }

    function updateGallery() {
      images.style.transform = `translateX(-${currentImageIndex * 100}%)`;
      updateDots();
    }

    function updateDots() {
      dots.forEach((dot, index) => {
        if (index === currentImageIndex) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function startSlideshow() {
      interval = setInterval(() => {
        currentImageIndex = (currentImageIndex + 1) % images.children.length;
        updateGallery();
      }, 2000);
    }

    function stopSlideshow() {
      clearInterval(interval);
    }

    startSlideshow();

    images.addEventListener('mouseenter', stopSlideshow);
    images.addEventListener('mouseleave', startSlideshow);
  });
</script>

</body>
</html>
