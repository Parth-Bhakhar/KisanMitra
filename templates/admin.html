<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Admin</title>
    <style>
        body {
            background-color: rgb(220, 213, 213);
            color: white;
            font-family: Calibri;
        }
        .container {
            margin-top: 20px;
            padding: 20px;
            width: 40%;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
            border: solid 3px transparent;
            border-radius: 10px;
            animation: border-animation 2s infinite, shadow-animation 2s infinite;
        }
        @keyframes border-animation {
            0% {
                border-color: red;
            }
            33% {
                border-color: green;
            }
            66% {
                border-color: blue;
            }
            100% {
                border-color: red;
            }
        }
        @keyframes shadow-animation {
            0% {
                box-shadow: 0 0 20px #ff0000;
            }
            33% {
                box-shadow: 0 0 20px #00ff00;
            }
            66% {
                box-shadow: 0 0 20px #0000ff;
            }
            100% {
                box-shadow: 0 0 20px #ff0000;
            }
        }
        .btn {
            width: 100%;
            margin-bottom: 10px;
        }
        a {
            color: #fff;
            display: block;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container mx-auto">
        <form method="post" action="{{ url_for('admin') }}" enctype="multipart/form-data">
            <a class="fs-5 btn btn-dark" href="{{ url_for('addequipment') }}">Add Equipments</a>
            <a class="fs-5 btn btn-dark" href="{{ url_for('addpesticide') }}">Add Pesticides</a>
            <a class="fs-5 btn btn-light" href="{{ url_for('showequipment') }}">View Equipments</a>
            <a class="fs-5 btn btn-light" href="{{ url_for('showpesticide') }}">View Pesticides</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMneT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
