<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    .container
    {
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 5%;
        border-radius: 8px;
        width: 40%;
    }
    .payment-method {
      margin-bottom: 20px;
    }

    .additional-fields {
      display: none;
    }

    .payment-box {
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 10%;">
        <h2><center>Select Payment Method</style></center></h2>
    </div>
  <form id="paymentForm">
    <div class="form-group payment-method">
      <input type="radio" id="cashOnDelivery" name="paymentMethod" value="cashOnDelivery" checked>
      <label for="cashOnDelivery">Cash on Delivery</label>
    </div>
    
    <div class="form-group payment-method">
      <input type="radio" id="upi" name="paymentMethod" value="upi">
      <label for="upi">UPI</label>
      <div class="additional-fields payment-box" id="upiFields">
        <input type="text" class="form-control" id="upiId" name="upiId" placeholder="Enter UPI ID">
      </div>
    </div>
    
    
    <div class="form-group payment-method">
      <input type="radio" id="debitCard" name="paymentMethod" value="debitCard">
      <label for="debitCard">Credit or Debit Card</label>
      <div class="additional-fields payment-box" id="debitCardFields">
        <!-- Add debit card details fields here -->
        <input type="text" class="form-control" id="CardHolderName" name="CardHolderName" placeholder="Card Holder Name" style="margin-bottom: 1%;" required>
        <input type="text" class="form-control" id="cardNumber" name="cardNumber" placeholder="Card Number" pattern="[0-9]{16}" title="Please enter a valid 16-digit card number" style="margin-bottom: 1%;" required>
        <div class="form-row">
          <div class="form-group col-md-6">
            <input type="text" class="form-control" id="expiryDate" name="expiryDate" placeholder="MM / YY" pattern="^(0[1-9]|1[0-2])\/?([0-9]{2})$" title="Please enter a valid expiration date in the format MM/YY" required>
          </div>
          <div class="form-group col-md-6">
            <input type="text" class="form-control" id="cvv" name="cvv" placeholder="CVV" pattern="[0-9]{3,4}" title="Please enter a valid CVV" required>
          </div>
        </div>
      </div>
    </div>
    
    <div class="form-group payment-method">
      <input type="radio" id="netBanking" name="paymentMethod" value="netBanking">
      <label for="netBanking">Net Banking</label>
    </div>
    
    <button type="submit" class="btn btn-primary">Proceed to Payment</button>
    <button type="submit" class="btn btn-danger">Cancel</button>
  </form>
</div>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
  $(document).ready(function(){
    $('input[type="radio"]').click(function(){
      var selectedPaymentMethod = $(this).val();
      $('.additional-fields').hide();
      $('#' + selectedPaymentMethod + 'Fields').show();
    });
  });
</script>

</body>
</html>
