<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h2>Farmer Registration</h2>

    {% if not registration_submitted %}
    <form id="registrationForm" action="/submit" method="post">
        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" required>

        <label for="last_name">Last Name:</label>
        <input type="text" name="last_name" required>

        <label for="country_code">Country Code:</label>
        <input type="text" name="country_code" placeholder="e.g., +1" required>

        <label for="phone_number">Phone Number:</label>
        <input type="tel" name="phone_number" placeholder="e.g., 1234567890" required>

        <label for="email">Email (Optional):</label>
        <input type="email" name="email">

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" required>

        <label for="gender">Gender:</label>
        <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <label for="farm_details">Farm Details:</label>
        <textarea name="farm_details" required></textarea>

        <label for="location">Location of Farm:</label>
        <input type="text" name="location" required>

        <button type="submit">Submit</button>
    </form>
    {% endif %}

    {% if registration_submitted %}
    <!-- OTP validation section -->
    <form id="otpForm" action="/validate_otp" method="post">
        <label for="otp">Enter OTP:</label>
        <input type="text" name="otp" required>
        <button type="submit">Validate OTP</button>
    </form>
    {% endif %}

</body>
</html>
